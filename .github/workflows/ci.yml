name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: setup
        run: make setup

      - name: lint
        run: make lint

      - name: test
        run: make test

      - name: boundaries
        run: make boundaries

      - name: run (config check)
        run: make run
