[project]
name = "zora-research"
version = "0.1.0"
description = "Python research engine for ZORA hypotheses"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.2",
    "tardis-dev>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "import-linter>=2.1",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"

# Flat layout: both packages live at the repo root. `scripts` is packaged too,
# because the collector's ClickHouse sink imports scripts.load_l1, and a script
# run by path (`python scripts/x.py`) only has scripts/ itself on sys.path.
[tool.uv.build-backend]
module-root = ""
module-name = ["research", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
